name: Publish build to CDN

# Mirrors every release to https://defender.lws-s1.com/sentinel-gate/code/ so the
# CDN copy can never drift behind git. Runs on GitHub's servers, so it works even
# if the machine that cut the release is offline.
#
# ── ONE-TIME SETUP ────────────────────────────────────────────────────────────
# Add these in:  repo → Settings → Secrets and variables → Actions → New secret
#     SG_CDN_USER   cPanel/FTP username
#     SG_CDN_PASS   cPanel/FTP password
# Optionally override the defaults as repository *variables*:
#     SG_CDN_HOST   (default: defender.lws-s1.com)
#     SG_CDN_PATH   (default: /public_html/defender.lws-s1.com/sentinel-gate/code)
#     SG_CDN_PROTO  (default: ftps — use sftp if SSH is enabled)
#
# Secrets are write-only: they are never printed and never reach the repo.

on:
  push:
    tags: ['v*']            # every released tag
  workflow_dispatch:        # or run it by hand to re-sync the CDN
    inputs:
      version:
        description: 'Version to (re)publish, e.g. 3.7.1. Blank = ./VERSION'
        required: false

concurrency:
  group: publish-cdn        # never let two uploads race the same manifest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Install build/upload tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip lftp curl

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="$(tr -d '[:space:]' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing v$V"

      - name: Guard — tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Tag v${TAG} does not match VERSION file (${FILE}). Refusing to publish a mismatched build."
            exit 1
          fi
          echo "Tag and VERSION agree: ${TAG}"

      # Fail fast with a precise message. A combined "one or both missing" check
      # is useless when you cannot see which one it is.
      - name: Preflight — credentials
        env:
          SG_CDN_USER: ${{ secrets.SG_CDN_USER }}
          SG_CDN_PASS: ${{ secrets.SG_CDN_PASS }}
        run: |
          MISSING=0
          if [ -z "$SG_CDN_USER" ]; then
            echo "::error title=SG_CDN_USER missing::Repository secret SG_CDN_USER is not set or is empty."
            MISSING=1
          else
            echo "SG_CDN_USER    : set (${#SG_CDN_USER} chars)"
          fi
          if [ -z "$SG_CDN_PASS" ]; then
            echo "::error title=SG_CDN_PASS missing::Repository secret SG_CDN_PASS is not set or is empty."
            MISSING=1
          else
            echo "SG_CDN_PASS    : set (${#SG_CDN_PASS} chars)"
          fi

          if [ "$MISSING" = "1" ]; then
            echo ""
            echo "Both secrets are required. Add them at:"
            echo "  Settings -> Secrets and variables -> Actions -> [Secrets tab] -> New repository secret"
            echo ""
            echo "  Name: SG_CDN_USER    Value: the cPanel/FTP username"
            echo "  Name: SG_CDN_PASS    Value: the cPanel/FTP password"
            echo ""
            echo "Common causes of this failure:"
            echo "  * Only one of the two was added (both are required)."
            echo "  * Added under the 'Variables' tab instead of 'Secrets'."
            echo "  * Added as an *Environment* secret — those need an 'environment:'"
            echo "    key on the job. Use repository secrets instead."
            echo "  * Name typo / stray whitespace — must match EXACTLY, case-sensitive."
            exit 1
          fi
          echo "Both credentials present."

      # Prove the runner can actually reach the FTP host and that the TLS cert
      # validates, BEFORE spending time on a build. A cert hostname mismatch here
      # is what produced the opaque "max-retries exceeded" failure.
      - name: Preflight — FTP connectivity and TLS
        env:
          SG_CDN_FTP_HOST: ${{ vars.SG_CDN_FTP_HOST || 'host.lws-s1.com' }}
          SG_CDN_PORT:     ${{ vars.SG_CDN_PORT || '21' }}
        run: |
          echo "Target: ${SG_CDN_FTP_HOST}:${SG_CDN_PORT}"
          getent hosts "$SG_CDN_FTP_HOST" || { echo "::error::DNS lookup failed for ${SG_CDN_FTP_HOST}"; exit 1; }

          timeout 15 bash -c "echo > /dev/tcp/${SG_CDN_FTP_HOST}/${SG_CDN_PORT}" 2>/dev/null \
            && echo "port ${SG_CDN_PORT}: reachable" \
            || { echo "::error::Cannot open ${SG_CDN_FTP_HOST}:${SG_CDN_PORT} from this runner. The FTP account may be IP-restricted in cPanel — GitHub runners use rotating IPs."; exit 1; }

          echo "Validating FTPS certificate…"
          OUT="$(timeout 25 openssl s_client -connect "${SG_CDN_FTP_HOST}:${SG_CDN_PORT}" \
                   -starttls ftp -servername "$SG_CDN_FTP_HOST" \
                   -verify_hostname "$SG_CDN_FTP_HOST" </dev/null 2>&1)" || true
          echo "$OUT" | grep -E '^subject=|Verify return code' | head -3
          if echo "$OUT" | grep -q 'Verify return code: 0'; then
            echo "TLS certificate validates for ${SG_CDN_FTP_HOST}"
          else
            echo "::warning::Certificate does NOT validate for ${SG_CDN_FTP_HOST}. Set the SG_CDN_FTP_HOST variable to the host the cert is issued for, or set SG_CDN_INSECURE=1 to skip validation."
          fi

      # Conclusive server-vs-runner test. Prints the runner's public IP, then
      # proves at each layer whether the SERVER responds: TCP handshake, FTP
      # banner, TLS, login. Whatever fails first is the answer.
      - name: Diagnose — is the block server-side?
        continue-on-error: true
        env:
          SG_CDN_USER: ${{ secrets.SG_CDN_USER }}
          SG_CDN_PASS: ${{ secrets.SG_CDN_PASS }}
          H: ${{ vars.SG_CDN_FTP_HOST || 'host.lws-s1.com' }}
        run: |
          echo "=============================================================="
          echo " Runner public IP (whitelist THIS if the server is filtering)"
          echo "=============================================================="
          curl -s --max-time 15 https://api.ipify.org || echo "(could not determine)"
          echo ""

          echo "=== 1. DNS ==="
          getent hosts "$H" || echo "DNS FAILED"

          echo ""
          echo "=== 2. TCP handshake to port 21 (does the server accept at all?) ==="
          if timeout 20 bash -c "cat < /dev/null > /dev/tcp/$H/21" 2>/dev/null; then
            echo "TCP: connection ACCEPTED"
          else
            echo "TCP: connection REFUSED or TIMED OUT"
            echo ">>> The server is not accepting connections from this IP."
            echo ">>> That is server-side filtering (CSF / cPHulk / host firewall)."
          fi

          echo ""
          echo "=== 3. Does the server send an FTP banner? (30s limit) ==="
          BANNER="$(timeout 30 bash -c "exec 3<>/dev/tcp/$H/21; timeout 20 head -c 200 <&3" 2>/dev/null || true)"
          if [ -n "$BANNER" ]; then
            echo "BANNER RECEIVED:"; echo "$BANNER" | tr -d '\r' | head -5
          else
            echo "NO BANNER — the TCP port opens but the server never replies."
            echo ">>> Classic signature of a firewall DROP rule for this IP range."
          fi

          echo ""
          echo "=== 4. TLS handshake ==="
          timeout 30 openssl s_client -connect "$H:21" -starttls ftp -servername "$H" \
            </dev/null 2>&1 | grep -E '^subject=|Protocol|Verify return code' | head -4 \
            || echo "TLS handshake did not complete"

          echo ""
          echo "=== 5. Full FTP login attempt via curl (verbose, password masked) ==="
          curl -v --ssl-reqd --ftp-pasv --max-time 45 \
               --config <(printf 'user = "%s:%s"\n' "$SG_CDN_USER" "$SG_CDN_PASS") \
               "ftp://$H/" --list-only 2>&1 \
            | sed -E 's/^(> PASS ).*/\1****/' | tail -40 \
            || echo "curl FTP attempt failed (see above)"

          echo ""
          echo "=============================================================="
          echo " READING THIS: if step 2 or 3 fails, the block is SERVER-SIDE."
          echo " Fix in WHM: ConfigServer Security & Firewall -> Quick Allow"
          echo " the runner IP above, and cPHulk -> History -> remove any block."
          echo " GitHub runner IPs ROTATE, so a permanent fix means either"
          echo " allowing Azure ranges or uploading from a fixed IP instead."
          echo "=============================================================="

      - name: Build release artifacts
        run: bash scripts/make-release.sh

      - name: Upload to CDN
        env:
          SG_CDN_USER:     ${{ secrets.SG_CDN_USER }}
          SG_CDN_PASS:     ${{ secrets.SG_CDN_PASS }}
          # Upload host and serving host differ on purpose — the FTPS cert is
          # valid for host.lws-s1.com, not defender.lws-s1.com (same server).
          SG_CDN_FTP_HOST: ${{ vars.SG_CDN_FTP_HOST || 'host.lws-s1.com' }}
          SG_CDN_HOST:     ${{ vars.SG_CDN_HOST  || 'defender.lws-s1.com' }}
          SG_CDN_PATH:     ${{ vars.SG_CDN_PATH  || '/public_html/defender.lws-s1.com/sentinel-gate/code' }}
          SG_CDN_PROTO:    ${{ vars.SG_CDN_PROTO || 'ftps' }}
          SG_CDN_INSECURE: ${{ vars.SG_CDN_INSECURE || '0' }}
        run: bash scripts/upload-cdn.sh

      # upload-cdn.sh already verifies the live channel, but re-check here from a
      # clean network path so a CDN cache serving stale bytes is caught too.
      - name: Verify live channel
        run: |
          BASE="https://${{ vars.SG_CDN_HOST || 'defender.lws-s1.com' }}/sentinel-gate/code"
          V="${{ steps.ver.outputs.version }}"
          echo "Checking ${BASE}"

          LIVE="$(curl -fsSL --max-time 30 "${BASE}/latest.json")" \
            || { echo "::error::latest.json unreachable"; exit 1; }
          echo "$LIVE"

          LIVE_V="$(printf '%s' "$LIVE" | grep -oE '"version"[^,]*' | head -1 | sed -E 's/.*"([^"]+)"$/\1/')"
          [ "$LIVE_V" = "$V" ] || { echo "::error::Live manifest says ${LIVE_V}, expected ${V}"; exit 1; }

          WANT="$(printf '%s' "$LIVE" | grep -oE '"sha256"[^,]*' | head -1 | sed -E 's/.*"([a-f0-9]+)".*/\1/')"
          for REL in "dist/sentinel-gate-${V}.zip" "v${V}/sentinel-gate-${V}.zip"; do
            curl -fsSL --max-time 300 -o /tmp/z.zip "${BASE}/${REL}" \
              || { echo "::error::${REL} not fetchable"; exit 1; }
            GOT="$(sha256sum /tmp/z.zip | awk '{print $1}')"
            [ "$GOT" = "$WANT" ] || { echo "::error::${REL} checksum mismatch"; exit 1; }
            echo "OK  ${REL}"
          done

          curl -fsSL --max-time 20 "${BASE}/get.sh" -o /dev/null \
            || { echo "::error::get.sh not served — the install one-liner will 404"; exit 1; }
          echo "OK  get.sh"

      - name: Summary
        if: success()
        run: |
          BASE="https://${{ vars.SG_CDN_HOST || 'defender.lws-s1.com' }}/sentinel-gate/code"
          V="${{ steps.ver.outputs.version }}"
          {
            echo "### v${V} published to CDN"
            echo ""
            echo '```bash'
            echo "bash <(curl -fsSL ${BASE}/get.sh)"
            echo '```'
            echo ""
            echo "- Manifest: ${BASE}/latest.json"
            echo "- Archive:  ${BASE}/v${V}/"
          } >> "$GITHUB_STEP_SUMMARY"
