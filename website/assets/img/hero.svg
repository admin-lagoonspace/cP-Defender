<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img"
     aria-label="ServerScrub dashboard showing a clean scan across protected accounts">
  <!-- Colours sampled from frontend/images/logo.png: navy #001a3d, blue
       #0090f0, green #00b03c. Nothing here is a chosen colour. -->
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f4fe"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0090f0"/><stop offset="1" stop-color="#001a3d"/>
    </linearGradient>
    <filter id="hs" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#001a3d" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="560" height="420" fill="url(#hg)" rx="16"/>

  <g filter="url(#hs)">
    <rect x="42" y="44" width="476" height="300" rx="12" fill="#fff" stroke="#d3e2f0"/>
    <rect x="42" y="44" width="476" height="40" rx="12" fill="#001a3d"/>
    <rect x="42" y="72" width="476" height="12" fill="#001a3d"/>
    <circle cx="62" cy="64" r="4.5" fill="#ff5f57"/>
    <circle cx="78" cy="64" r="4.5" fill="#febc2e"/>
    <circle cx="94" cy="64" r="4.5" fill="#00b03c"/>
    <text x="116" y="69" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#7f9ab5">
      serverscrub — dashboard</text>

    <g>
      <rect x="62" y="102" width="106" height="62" rx="8" fill="#f5f8fb" stroke="#dde4ec"/>
      <text x="76" y="131" font-size="22" font-weight="700" fill="#00b03c">0</text>
      <text x="76" y="149" font-size="9.5" fill="#6b7784" letter-spacing=".5">ACTIVE THREATS</text>

      <rect x="180" y="102" width="106" height="62" rx="8" fill="#f5f8fb" stroke="#dde4ec"/>
      <text x="194" y="131" font-size="22" font-weight="700" fill="#0090f0">118</text>
      <text x="194" y="149" font-size="9.5" fill="#6b7784" letter-spacing=".5">ACCOUNTS</text>

      <rect x="298" y="102" width="106" height="62" rx="8" fill="#f5f8fb" stroke="#dde4ec"/>
      <text x="312" y="131" font-size="22" font-weight="700" fill="#b26a00">47</text>
      <text x="312" y="149" font-size="9.5" fill="#6b7784" letter-spacing=".5">IPS BLOCKED</text>

      <rect x="416" y="102" width="86" height="62" rx="8" fill="#f5f8fb" stroke="#dde4ec"/>
      <text x="430" y="131" font-size="22" font-weight="700" fill="#00b03c">OK</text>
      <text x="430" y="149" font-size="9.5" fill="#6b7784" letter-spacing=".5">FIREWALL</text>
    </g>

    <g font-size="11" font-family="ui-monospace,Menlo,monospace">
      <rect x="62" y="184" width="440" height="30" rx="6" fill="#f5f8fb"/>
      <circle cx="80" cy="199" r="5" fill="#00b03c"/>
      <text x="96" y="203" fill="#36434f">/home/acct01/public_html</text>
      <text x="432" y="203" fill="#00b03c">clean</text>

      <rect x="62" y="220" width="440" height="30" rx="6" fill="#fff6ed"/>
      <circle cx="80" cy="235" r="5" fill="#b26a00"/>
      <text x="96" y="239" fill="#36434f">/home/acct02 — WordPress 6.4.1</text>
      <text x="404" y="239" fill="#b26a00">outdated</text>

      <rect x="62" y="256" width="440" height="30" rx="6" fill="#fdeeec"/>
      <circle cx="80" cy="271" r="5" fill="#d93a2b"/>
      <text x="96" y="275" fill="#36434f">uploads/x.php — PHP.Webshell</text>
      <text x="394" y="275" fill="#d93a2b">quarantined</text>

      <rect x="62" y="292" width="440" height="30" rx="6" fill="#f5f8fb"/>
      <circle cx="80" cy="307" r="5" fill="#00b03c"/>
      <text x="96" y="311" fill="#36434f">185.177.72.49 — scanner</text>
      <text x="422" y="311" fill="#00b03c">blocked</text>
    </g>
  </g>

  <!-- The shield, in the logo's own gradient. -->
  <g transform="translate(452,296)">
    <circle cx="34" cy="34" r="34" fill="#fff" stroke="#d3e2f0"/>
    <path d="M34 12 52 19v15c0 10.5-7.5 18.7-18 21.7C23.5 52.7 16 44.5 16 34V19z" fill="url(#shield)"/>
    <path d="M26 34.5l5.6 5.6L45 27" fill="none" stroke="#00b03c" stroke-width="4.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
