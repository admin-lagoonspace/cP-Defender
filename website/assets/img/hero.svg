<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img"
     aria-label="ServerScrub dashboard showing a clean scan across protected accounts">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf3fb"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="hs" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f1720" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="560" height="420" fill="url(#hg)" rx="16"/>

  <g filter="url(#hs)">
    <rect x="42" y="44" width="476" height="300" rx="12" fill="#fff" stroke="#dde4ec"/>
    <rect x="42" y="44" width="476" height="40" rx="12" fill="#0f1720"/>
    <rect x="42" y="72" width="476" height="12" fill="#0f1720"/>
    <circle cx="62" cy="64" r="4.5" fill="#ff5f57"/>
    <circle cx="78" cy="64" r="4.5" fill="#febc2e"/>
    <circle cx="94" cy="64" r="4.5" fill="#28c840"/>
    <text x="116" y="69" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8b98a5">
      serverscrub — dashboard</text>

    <!-- stat tiles -->
    <g>
      <rect x="62" y="102" width="106" height="62" rx="8" fill="#f6f8fa" stroke="#e2e7ec"/>
      <text x="76" y="131" font-size="22" font-weight="700" fill="#15794f">0</text>
      <text x="76" y="149" font-size="9.5" fill="#6b7784" letter-spacing=".5">ACTIVE THREATS</text>

      <rect x="180" y="102" width="106" height="62" rx="8" fill="#f6f8fa" stroke="#e2e7ec"/>
      <text x="194" y="131" font-size="22" font-weight="700" fill="#1668b3">118</text>
      <text x="194" y="149" font-size="9.5" fill="#6b7784" letter-spacing=".5">ACCOUNTS</text>

      <rect x="298" y="102" width="106" height="62" rx="8" fill="#f6f8fa" stroke="#e2e7ec"/>
      <text x="312" y="131" font-size="22" font-weight="700" fill="#b26a00">47</text>
      <text x="312" y="149" font-size="9.5" fill="#6b7784" letter-spacing=".5">IPS BLOCKED</text>

      <rect x="416" y="102" width="86" height="62" rx="8" fill="#f6f8fa" stroke="#e2e7ec"/>
      <text x="430" y="131" font-size="22" font-weight="700" fill="#15794f">OK</text>
      <text x="430" y="149" font-size="9.5" fill="#6b7784" letter-spacing=".5">FIREWALL</text>
    </g>

    <!-- scan rows -->
    <g font-size="11" font-family="ui-monospace,Menlo,monospace">
      <rect x="62" y="184" width="440" height="30" rx="6" fill="#f6f8fa"/>
      <circle cx="80" cy="199" r="5" fill="#15794f"/>
      <text x="96" y="203" fill="#3b4754">/home/acct01/public_html</text>
      <text x="432" y="203" fill="#15794f">clean</text>

      <rect x="62" y="220" width="440" height="30" rx="6" fill="#fff6ed"/>
      <circle cx="80" cy="235" r="5" fill="#b26a00"/>
      <text x="96" y="239" fill="#3b4754">/home/acct02 — WordPress 6.4.1</text>
      <text x="404" y="239" fill="#b26a00">outdated</text>

      <rect x="62" y="256" width="440" height="30" rx="6" fill="#fdeeec"/>
      <circle cx="80" cy="271" r="5" fill="#c0392b"/>
      <text x="96" y="275" fill="#3b4754">uploads/x.php — PHP.Webshell</text>
      <text x="394" y="275" fill="#c0392b">quarantined</text>

      <rect x="62" y="292" width="440" height="30" rx="6" fill="#f6f8fa"/>
      <circle cx="80" cy="307" r="5" fill="#15794f"/>
      <text x="96" y="311" fill="#3b4754">185.177.72.49 — scanner</text>
      <text x="422" y="311" fill="#15794f">blocked</text>
    </g>
  </g>

  <!-- shield badge -->
  <g transform="translate(452,296)">
    <circle cx="34" cy="34" r="34" fill="#fff" stroke="#dde4ec"/>
    <path d="M34 12 52 19v15c0 10.5-7.5 18.7-18 21.7C23.5 52.7 16 44.5 16 34V19z" fill="#1668b3"/>
    <path d="M26 34.5l5.6 5.6L45 27" fill="none" stroke="#fff" stroke-width="4.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
